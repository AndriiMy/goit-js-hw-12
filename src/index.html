<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoIT · Image Search</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <form class="search-form">
      <input class="search-input" type="text" placeholder="Search images..." aria-label="Search images" />
      <button class="search-button" type="submit">Search</button>
    </form>
    <ul class="gallery"></ul>
    <button class="load-more hidden" type="button">Load more</button>
    <div class="loader hidden" aria-label="Loading"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
